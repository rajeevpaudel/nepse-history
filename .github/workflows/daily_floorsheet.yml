name: Daily floorsheet fetch

on:
  schedule:
    # 16:00 NPT (Asia/Kathmandu, UTC+5:45) = 10:15 UTC, well after the
    # ~15:00 NPT market close so today's session is locked in.
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional single date to (re)process (YYYY-MM-DD). Leave blank for normal catch-up."
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily fetch (primary NEPSE, merolagani fallback)
        id: run_daily
        # A failed date shouldn't block committing whatever *did* succeed —
        # the job is still marked failed (and thus visible) by the final
        # step below, but that happens after the commit/push. Output is
        # tee'd to a log file so the failure-notification step can quote it.
        continue-on-error: true
        run: |
          set -o pipefail
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/run_daily.py --date "${{ github.event.inputs.date }}" 2>&1 | tee run_daily.log
          else
            python scripts/run_daily.py 2>&1 | tee run_daily.log
          fi

      - name: Commit and push data + manifest
        id: commit_push
        continue-on-error: true
        run: |
          set -o pipefail
          {
            git config user.name "nepse-floorsheet-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/floorsheet data/ohlcv manifest.json PROGRESS.md data/discrepancies.csv
            git diff --cached --quiet || git commit -m "Daily floorsheet fetch $(date -u +%Y-%m-%d)"
            git push
          } 2>&1 | tee commit_push.log

      - name: Fail the job if a previous step reported an error
        if: steps.run_daily.outcome == 'failure' || steps.commit_push.outcome == 'failure'
        run: exit 1

      - name: File/update a GitHub issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FAILED_STEPS=""
          if [ "${{ steps.run_daily.outcome }}" = "failure" ]; then
            FAILED_STEPS="${FAILED_STEPS}- \`run scripts/run_daily.py\` (NEPSE + merolagani fetch)\n"
          fi
          if [ "${{ steps.commit_push.outcome }}" = "failure" ]; then
            FAILED_STEPS="${FAILED_STEPS}- \`git commit/push\`\n"
          fi
          if [ -z "$FAILED_STEPS" ]; then
            FAILED_STEPS="- (unknown step — check the run log)\n"
          fi

          {
            echo "Workflow run: $RUN_URL"
            echo ""
            echo "Failed step(s):"
            echo -e "$FAILED_STEPS"
            echo "### run_daily.py output (tail)"
            echo '```'
            tail -n 80 run_daily.log 2>/dev/null || echo "(no log captured)"
            echo '```'
            if [ -f commit_push.log ]; then
              echo "### git commit/push output (tail)"
              echo '```'
              tail -n 40 commit_push.log
              echo '```'
            fi
          } > issue_body.md

          existing=$(gh issue list --repo "${{ github.repository }}" \
            --search "\"Daily floorsheet fetch failing\" in:title" --state open \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body-file issue_body.md
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "Daily floorsheet fetch failing" \
              --body-file issue_body.md
          fi
