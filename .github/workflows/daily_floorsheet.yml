name: Daily floorsheet fetch

on:
  schedule:
    # 16:00 NPT (Asia/Kathmandu, UTC+5:45) = 10:15 UTC, well after the
    # ~15:00 NPT market close so today's session is locked in.
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional single date to (re)process (YYYY-MM-DD). Leave blank for normal catch-up."
        required: false
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily fetch (primary NEPSE, merolagani fallback)
        id: run_daily
        # A failed date shouldn't block committing whatever *did* succeed —
        # the job is still marked failed (and thus visible) by the final
        # step below, but that happens after the commit/push.
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/run_daily.py --date "${{ github.event.inputs.date }}"
          else
            python scripts/run_daily.py
          fi

      - name: Commit and push data + manifest
        run: |
          git config user.name "nepse-floorsheet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/floorsheet manifest.json PROGRESS.md data/discrepancies.csv
          git diff --cached --quiet || git commit -m "Daily floorsheet fetch $(date -u +%Y-%m-%d)"
          git push

      - name: Fail the job if run_daily.py reported an error
        if: steps.run_daily.outcome == 'failure'
        run: exit 1
